[project]
name = "eodh-openapi"
version = "0.1.0"
description = "OpenAPI docs for UK EO DataHub. Merges OpenAPI docs from multiple sources into one deployment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.4",
]
